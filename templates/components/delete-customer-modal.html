{% load static %}

<!-- Modal -->
<div id="deleteCustomerModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="deleteCustomerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-centering" style="max-width: 390px;">
    <div class="modal-content">

      <div class="modal-header">
        <div>
          <div class="modal-icon">
            <!-- delete icon -->
            <img
              src="{% static 'icons/delete-red.svg' %}"
              alt="delete icon"
              width="18"
              height="18"
            />
          </div>
          <h5 class="modal-title" id="deleteCustomerModalLabel">Delete this customer</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>This will permanently remove <strong>{{ record.first_name|capfirst }} {{ record.last_name|capfirst }}</strong> and all their data. This action cannot be undone.</p>
      </div>

      <div class="modal-footer d-flex">
        <button type="button" class="btn btn-cancel" data-bs-dismiss="modal">Cancel</button>
        <a href="#" class="btn btn-delete text-center">Yes, Delete it</a>
      </div>

    </div>
  </div>
</div>
