{% load static %}
<!-- ── Left Panel ── -->
<div class="col-md-5 col-lg-5 panel-left">
  <!-- circular web shape -->
  <svg
    class="geo-lines"
    width="480"
    height="480"
    viewBox="0 0 480 480"
    fill="none"
  >
    <circle cx="240" cy="240" r="190" stroke="white" stroke-width="1" />
    <circle cx="240" cy="240" r="130" stroke="white" stroke-width="1" />
    <circle cx="240" cy="240" r="70" stroke="white" stroke-width="1" />
    <line x1="50" y1="240" x2="430" y2="240" stroke="white" stroke-width="1" />
    <line x1="240" y1="50" x2="240" y2="430" stroke="white" stroke-width="1" />
    <line x1="90" y1="90" x2="390" y2="390" stroke="white" stroke-width="1" />
    <line x1="390" y1="90" x2="90" y2="390" stroke="white" stroke-width="1" />
  </svg>

  <!-- logo -->
  <a class="navbar-brand" href="{% url 'index' %}">
    <img src="{% static 'logo-white.svg' %}" alt="logo" width="22px" />
    <strong class="brand-name">Focus</strong>
  </a>

  <!-- slogan -->
  <div class="tagline-block">
    <h2>Shape your<br /><em>customer journey</em><br />with simplicity.</h2>
    <p>
      A calm, intelligent workspace for people who take their money seriously.
    </p>

    <div class="social-proof">
      <div class="avatars">
        <div class="avatar">JL</div>
        <div class="avatar">MR</div>
        <div class="avatar">TK</div>
        <div class="avatar">SA</div>
      </div>
      <div class="proof-text">
        <strong>250+</strong> members<br />joined this month
      </div>
    </div>
  </div>
</div>
