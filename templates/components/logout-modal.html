{% load static %}

<!-- Modal -->
<div id="logoutModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="logoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-centering" style="max-width: 390px;">
    <div class="modal-content">

      <div class="modal-header">
        <div>
          <div class="modal-icon">
            <!-- logout icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e7000b"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </div>
          <h5 class="modal-title" id="logoutModalLabel">Sign out of your account?</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <p>Are you sure you need to logout?</p>
      </div>

      <div class="modal-footer d-flex">
        <button type="button" class="btn btn-cancel" data-bs-dismiss="modal">Cancel</button>
        <a href="{% url 'logout' %}" class="btn btn-logout text-center">Yes, sign out</a>
      </div>

    </div>
  </div>
</div>
